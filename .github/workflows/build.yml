name: Build e testes

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Testes reais do motor nativo (x86_64): compara com o chdman oficial
  # compilado do mesmo código, ida e volta, cancelamento, falta de espaço,
  # arquivos corrompidos e imagem > 4 GB.
  # ---------------------------------------------------------------------------
  native-tests:
    name: Motor nativo (x86_64, GCC e Clang/libc++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cmake clang libc++-dev libc++abi-dev
          pip install --break-system-packages pycdlib
      - name: Compilar (GCC)
        run: |
          cmake -S app/src/main/cpp -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build-gcc.log
          cmake --build build-gcc 2>&1 | tee -a build-gcc.log
      - name: Testes (GCC, inclui > 4 GB)
        run: tests/native/run_tests.sh build-gcc --big 2>&1 | tee tests-gcc.log
      - name: Compilar (Clang + libc++, como o NDK)
        run: |
          cmake -S app/src/main/cpp -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ 2>&1 | tee build-clang.log
          cmake --build build-clang 2>&1 | tee -a build-clang.log
      - name: Testes (Clang)
        run: tests/native/run_tests.sh build-clang 2>&1 | tee tests-clang.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-motor-nativo
          path: "*.log"

  # ---------------------------------------------------------------------------
  # Benchmark dos perfis (imagens sintéticas; runner x86_64)
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmark dos perfis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cmake ffmpeg
          pip install --break-system-packages pycdlib
      - name: Compilar
        run: |
          cmake -S app/src/main/cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Executar
        run: |
          nproc | tee benchmark.txt
          python3 tests/bench/make_bench_images.py /tmp/bench build/mkraw | tee -a benchmark.txt
          tests/bench/run_bench.sh build /tmp/bench benchmark.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            benchmark.txt
            benchmark.jsonl

  # ---------------------------------------------------------------------------
  # Mesmos testes com o motor compilado para ARM64 e executado via QEMU
  # ---------------------------------------------------------------------------
  native-tests-arm64:
    name: Motor nativo (ARM64 via QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cmake g++-aarch64-linux-gnu qemu-user
          pip install --break-system-packages pycdlib
      - name: Compilar para aarch64
        run: |
          cmake -S app/src/main/cpp -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static 2>&1 | tee build-arm64.log
          cmake --build build-arm64 2>&1 | tee -a build-arm64.log
      - name: Testes sob QEMU
        run: |
          mkdir -p wrap
          for b in chdengine_cli chdman; do
            printf '#!/bin/sh\nexec qemu-aarch64 %s/build-arm64/%s "$@"\n' "$PWD" "$b" > wrap/$b
            chmod +x wrap/$b
          done
          tests/native/run_tests.sh wrap 2>&1 | tee tests-arm64.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-motor-arm64
          path: "*.log"

  # ---------------------------------------------------------------------------
  # APK (arm64-v8a) + testes de unidade
  # ---------------------------------------------------------------------------
  android:
    name: APK Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK, NDK e CMake
        run: |
          # o runner já traz o Android SDK em $ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" | tail -5
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APKs e testes de unidade
        env:
          CONVERSOR_KEYSTORE: ${{ secrets.CONVERSOR_KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          CONVERSOR_KEYSTORE_PASSWORD: ${{ secrets.CONVERSOR_KEYSTORE_PASSWORD }}
          CONVERSOR_KEY_ALIAS: ${{ secrets.CONVERSOR_KEY_ALIAS }}
          CONVERSOR_KEY_PASSWORD: ${{ secrets.CONVERSOR_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.CONVERSOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.jks; else unset CONVERSOR_KEYSTORE; fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --info assembleDebug assembleRelease testDebugUnitTest lintRelease 2>&1 | tee gradle-build.log
      - name: Conferir bibliotecas nativas no APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | tee apk-contents.txt
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libchdconv.so"
          # alinhamento de 16 KB (Android 15+)
          unzip -o -q "$APK" "lib/arm64-v8a/libchdconv.so" -d apk-lib
          $ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -lW apk-lib/lib/arm64-v8a/libchdconv.so | tee -a apk-contents.txt | grep LOAD
      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/CHDify-1.0.0-${{ github.run_number }}-arm64-v8a.apk
          cp app/build/outputs/apk/debug/*.apk dist/CHDify-1.0.0-${{ github.run_number }}-arm64-v8a-debug.apk
      - name: Conferir assinatura
        env:
          KEYSTORE_B64: ${{ secrets.CONVERSOR_KEYSTORE_BASE64 }}
        run: |
          APK=$(ls dist/*-arm64-v8a.apk)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee assinatura.txt
          if [ -n "$KEYSTORE_B64" ]; then echo "SIGNING=release" >> "$GITHUB_ENV"; else echo "SIGNING=debug" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: CHDify-apk
          path: dist/*.apk
      - name: Publicar na Release "ultima-versao"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/CHDify-1.0.0-${{ github.run_number }}-arm64-v8a.apk dist/CHDify-arm64-v8a.apk
          {
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo "Build ${{ github.run_number }} · commit ${{ github.sha }}"
            if [ "$SIGNING" = release ]; then
              echo "Assinado com a chave de release do CHDify (atualizações futuras instalam por cima)."
            else
              echo "ATENÇÃO: assinado com chave temporária de depuração (os secrets de assinatura não estão configurados). Atualizações futuras exigirão desinstalar."
            fi
            echo
            echo '```'
            grep -E "SHA-256" assinatura.txt || true
            echo '```'
          } > notes.md
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao dist/CHDify-arm64-v8a.apk dist/*-debug.apk \
            --title "CHDify 1.0.0 (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --target "${{ github.sha }}" --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-android
          path: |
            gradle-build.log
            apk-contents.txt
            assinatura.txt
            app/build/reports/**
            app/.cxx/**/*.log
            app/.cxx/**/build.ninja
            app/build/intermediates/cmake/**/*.json

  # ---------------------------------------------------------------------------
  # Testes instrumentados: conversão real no emulador Android (x86_64)
  # ---------------------------------------------------------------------------
  emulator-tests:
    name: Testes no emulador (Android 14 e 15)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK, NDK e CMake
        run: |
          # o runner já traz o Android SDK em $ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" | tail -5
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar testes instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            chmod +x gradlew
            bash -o pipefail -c "./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -PemulatorAbi=true 2>&1 | tee emulator-tests.log"
            adb logcat -d -s CHDify:* MAME:* AndroidRuntime:E TestRunner:* > logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-emulador-api${{ matrix.api-level }}
          path: |
            emulator-tests.log
            logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
